# config.toml — Codex projection of the org's runtime settings. Drop at <repo>/.codex/config.toml.
# Codex loads project-local config ONLY when the project is trusted (learn.chatgpt.com/docs/config-file).
# This is the harness-map layer of PROJECTION.md for Codex: it maps the org's NEUTRAL role-settings
# (template/role-settings.yaml — model_tier/effort/tools) onto Codex's concrete knobs. The
# org's SCHEDULE (template/schedule.yaml) is still driven by an external cron/CI (R0 — no built-in
# scheduler, same as Claude Code); this file only sets model/sandbox/approval/MCP per project.

# OrgForge の既定モデル。高速と判断品質の釣り合いから `gpt-5.6-terra` / `medium` を
# 採る。headless cross-harness judge は各リポジトリの
# `constitution.yaml: enforcement.judges.harness.<harness>.<role>.model` と `effort`
# が優先するため、役割ごとにここより深いモデルへ上げられる。
#
# 使用可能なモデル名は契約・アカウントに依存するため、採用前に
# `codex exec -m <m> "Reply OK" </dev/null` で確認すること。
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"        # minimal|low|medium|high|xhigh

# Trusted developer mode: no approval prompts and no filesystem/network sandbox. Use this only on
# a development machine/repository that contains no production credentials. The org's policy and
# hooks still meter/block declared dangerous actions, but they are not a hostile-process boundary.
approval_policy = "never"                # autonomous trusted developer mode; no escalation
sandbox_mode = "danger-full-access"      # trusted developer mode; host sandbox disabled

[sandbox_workspace_write]
network_access = true                    # retained for users who locally override back to workspace-write

# The per-department instruction file convention is AGENTS.md (see integrations/codex/AGENTS.md.tmpl).
project_doc_fallback_filenames = ["AGENTS.md"]

# Optional: expose the org's organ tools to Codex as an MCP server, so a department can call
# `reconcile.py mandate` etc. as a first-class tool rather than shelling out. (An adopter wires
# a thin MCP wrapper around tools/*.py; left as a stub here.)
# [mcp_servers.org_organs]
# command = "python3"
# args = ["integrations/common/org_mcp_server.py"]
