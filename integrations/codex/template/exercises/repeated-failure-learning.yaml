schema_version: 1
id: repeated-failure-learning-minimal
description: a repeated death becomes an actionable learning signal without silently changing doctrine
time_budget_seconds: 60
critical_functions: [evidence_integrity, human_control]
acceptable_outcomes: [observe_only, safe_stop, human_handback]
repeated_failure:
  cause: missing independent evidence at the review seam
  candidate_ids: [candidate-A, candidate-B, candidate-C]
  recurrence: 2
expected:
  learning_returncode: 10
  escalation_marker: "NEXT: この死因を doctrine に上げること"
  outcome: observe_only
  gaps: []
blast_radius:
  faults: 0
  workspace: temporary_directory
  network: forbidden
  real_repository_mutation: forbidden
  production_credentials: forbidden
potentials:
  repeated_failure_observed: [Monitor, Learn]
  actionable_handoff_emitted: [Learn, Respond]
  permanent_change_requires_human: [Anticipate, Respond]
  false_clean_prevented: [Monitor, Anticipate]
human_judgment:
  - whether the recurring cause warrants a role, contract, or context-flow change
  - which bounded microexperiment should test the proposed practice before adoption
  - whether the evidence is sufficient to alter doctrine or only to observe
