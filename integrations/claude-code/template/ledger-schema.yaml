# ledger-schema.yaml — the audit + enforcement record, specified. NOT the SSoT: the SSoT is code + the domain model (conventions + org spec); this is the tamper-evident process journal views project from.
#
# The ledger is Organ 5's shared record and Organ 6's custody+recording holder. This file
# defines its envelope (tamper evidence), its event classes (the org's complete factual
# vocabulary — if it isn't an event class, it didn't happen), its derived views (the ONLY
# things context packs may contain), and how packs are assembled. Views are regenerated
# from events, never hand-edited. The runtime that serves this schema is specified in
# docs/08-runtime.md; the lint cross-checks every reference in organization.yaml,
# moves.yaml, and sensors.yaml against this file.

# ── Envelope: every event, no exceptions ─────────────────────────────────────
envelope:
  fields:
    id: uuid                       # idempotency key (at-least-once delivery, dedup on id)
    seq: monotonic_integer         # assigned by the ledger service, gapless per ledger
    ts: rfc3339_utc
    actor: role_id | human:<name> | system:<component>   # from runtime identity, NEVER from payload
    class: one_of_event_classes_below
    payload: class_specific_object
    prev_hash: sha256              # hash chain: tamper evidence
    hash: sha256                   # H(prev_hash || canonical_json(id,seq,ts,actor,class,payload))
  write_control:
    append_only: true
    single_writer: ledger_service  # agents call append(); they never hold the file/store
    actor_identity_source: runtime_session   # an agent cannot claim another's actor id
    verification: external_watchdog_replays_hash_chain   # docs/05 §2.4, docs/08 §5

# ── Event classes: the org's complete factual vocabulary ────────────────────
# ── the axes of validation (Writer Phase 0 / 0.33.1) ────────────────────────
# **Three are kept apart.** Making every class closed-world at once turns a schema divergence into
# "the whole org stops recording" — that is not fail-closed but an availability incident caused by
# a known migration gap.
#
#   # ── Identity: three principals, and four independent axes of assurance (H1) ──
# **`actor` mixed three concepts.** Who judged, who recorded, and who committed are different
# things. Where a supervisor proxy-records a gate's judgment (the shape operation actually takes),
# the observed actor is always the supervisor, so a separation of duties comparing `actor` values
# can only say "the supervisor did not approve the supervisor".
#
#   decision_by    the principal that formed the judgment. **Settled only from a signed receipt.**
#                  It cannot be set by a self-declaration on the CLI — anything declarable can be
#                  claimed as anyone's judgment.
#   recorded_by    the principal that transcribed and submitted it. **Observed** from the hook /
#                  session. Proxy recording is allowed (a judge need not append directly).
#   committed_by   the principal of the writer that committed it to the ledger. **The isolated
#                  writer sets this itself.**
#
# **The separation of duties compares `decision_by` values only.** Never compare `recorded_by` —
# under proxy recording it is always the same principal, so comparing it makes every legitimate
# operation a violation.
#
# ## Assurance is not a single strong/weak value
#
# Four are held as separate axes. Collapsing them invites the misreading "it is signed, therefore
# it is independent" — **if one process, or one key, can produce both lineages, it is not
# independent review.**
identity:
  assurance_axes:
    identity_assurance:    [claimed, observed, attested, authenticated]
    recorder_assurance:    [claimed, observed]
    workload_isolation:    [none, separate_process, separate_uid, separate_host]
    reviewer_independence: [same_signer, distinct_signer, distinct_workload]
  # Compatibility Mode: without a receipt, decision_by stays `claimed`.
  #   → it is **evidence that independent review happened**, but **cannot be used to enforce
  #     independence**.
  # Authenticated Mode: only an isolated writer, a limited path, protected keys, and per-principal
  #   authorization together earn the name `authenticated`. **Asking in a separate process is not a
  #   trust boundary** — as long as the same user can replace the writer or the keys, it is not
  #   authenticated.
  legacy_actor: claimed    # an `actor` from before 0.36.x is kept as a claimed attribute and never
                           # promoted

#     required: [..]                  refuse a missing required field, for declared classes only
#     <field>: a|b|c                  validate a declared field's enum / type **where it is
#                                     present**
#     additional_properties: false    refuse an undeclared field, for the classes to be tightened
#
# An undeclared field is allowed by default and recorded in the census (the divergence is made
# visible without stopping anything).
# The control events (admission / verdict / cap reservation) sit on the strict side from the start.
# `progress_recorded`'s reality diverges from its declaration, so it is tightened in a separate
# migration **after the reality is reflected into the schema** (of 43 real rows, fraction appeared
# 0 times and an undeclared milestone 38 times).
#
# required is **decided by counting real data** — a declaration at odds with reality makes the check
# a lie.
validation:
  required:
    admission_decided:    [verdict]
    refutation_attempted: [verdict]
    verdict_provisional:  [role, lineage, verdict, for_event,
                           review_subject_id, reasoning_sha256]
    judges_disagreed:     [for_event]
    phase_started:        [phase, role]
    phase_admitted:       [phase, verdict]
    correction:           [corrects, kind]
    exposure_budget_checked: [window_id, dimension, committed_so_far, delta_requested, cap,
                              actor_role, decision, session_id, tool_use_id, rule,
                              request_digest]
    halt_tripped:            [trigger, scope, reason, tripped_by]
    halt_released:           [releases_seq, reason, released_by, recovery_verified,
                              identity_assurance]
    goal_started:            [goal_id, objective, session_id, harness]
    goal_progressed:         [goal_id, session_id, summary, next_step]
    goal_paused:             [goal_id, session_id, reason, next_step]
    goal_blocker_observed:   [goal_id, session_id, blocker, evidence]
    goal_blocked:            [goal_id, session_id, blocker, occurrences, evidence]
    goal_resumed:            [goal_id, from_session_id, session_id, reason, harness]
    goal_completed:          [goal_id, session_id, summary, evidence]
    goal_host_synced:        [goal_id, session_id, harness, native_state, assurance]
    adaptive_envelope_activated: [envelope_id, envelope_version, trigger, source, activation_id,
                                  baseline_ref, evidence, confidence, expires_at,
                                  affected_critical_functions]
    adaptive_deviation_recorded: [envelope_id, activation_id, action, phase, artifacts,
                                  wai_baseline, reason, result, missing_evidence,
                                  tainted_artifacts, revalidation_scope]
    adaptive_envelope_expired: [envelope_id, activation_id, reason]
    adaptive_envelope_reverted: [envelope_id, activation_id, reason, evidence]
    adaptive_envelope_adopted: [envelope_id, activation_id, human_decision_ref,
                                microexperiment_ref, practice_change_ref, decision_by, recorded_by,
                                identity_assurance, recorder_assurance, workload_isolation]
    acceptable_outcome_recorded: [critical_function, outcome, evidence, judged_by]
    microexperiment_concluded: [experiment_id, envelope_id, hypothesis, result, evidence, judged_by]
    circuit_state_changed: [circuit_id, dependency, from_state, to_state, reason, evidence,
                            confidence, retry_count, retry_budget, cooldown_until, session_id,
                            envelope_id, activation_id]
    operational_state_transitioned: [transition_id, from_state, to_state, circuit_id, reason,
                                     evidence, confidence, session_id, transitioned_by,
                                     envelope_id, activation_id]
    operational_escalated: [circuit_id, failures, retry_budget, reason, evidence, route_to]
    artifact_tainted: [artifact, cause_seq, circuit_id, envelope_id, activation_id, reason,
                       revalidation_scope]
    recovery_probe_recorded: [circuit_id, activation_id, result, evidence, confidence, session_id]
    artifact_revalidated: [artifact, activation_id, checks, result, evidence, verified_by,
                           session_id]
    scheduled_check_completed: [check_id, scheduled_for_min, execution_id, result, exit_code,
                                command_sha256, plugin_version]
  # **Any one correlation key is enough.** deliverable, candidate_id, claim_id, and issue are all
  # legitimate correlation keys (`_same_work` unions them), and which is used depends on the path.
  # Fixing on one rejects legitimate writes (it actually rejected the controls' own tests).
  # **A judgment carrying none is refused** — a record that does not say what it judges cannot be
  # used in a check.
  require_any:
    admission_decided:    [deliverable, candidate_id, issue]
    refutation_attempted: [deliverable, claim_id, candidate_id, issue]
    verdict_provisional:  [deliverable, issue]
    judges_disagreed:     [deliverable, issue]
    phase_started:        [deliverable, candidate_id]
    phase_admitted:       [deliverable, candidate_id]
    result_deployed:      [deliverable, claim_id, candidate_id, issue]
  # The classes that refuse an undeclared field (closed world). Narrowed to the core of the
  # controls.
  additional_properties_false: [verdict_provisional, judges_disagreed, exposure_budget_checked,
                                halt_tripped, halt_released, goal_started, goal_progressed,
                                goal_paused, goal_blocker_observed, goal_blocked, goal_resumed,
                                goal_completed, goal_host_synced, adaptive_envelope_activated,
                                adaptive_deviation_recorded, adaptive_envelope_expired,
                                adaptive_envelope_reverted, adaptive_envelope_adopted,
                                acceptable_outcome_recorded, microexperiment_concluded,
                                circuit_state_changed, operational_state_transitioned,
                                operational_escalated, artifact_tainted,
                                recovery_probe_recorded, artifact_revalidated,
                                scheduled_check_completed]
  # **Writer-only classes.** A generic append cannot write them.
  #
  # A state where a cap reservation can be written by an ordinary append voids the cap itself —
  # measured: after appending `delta_requested: -100`, a delta of 50 was allowed against a cap of 5,
  # with the chain intact. **A record used in a check must be writable only by whoever checks.**
  #
  # This is not identity authentication (H1 is a separate problem). Under the same UID one can still
  # impersonate the writer.
  # What it does close is "it can be written through the ordinary append path, by accident or
  # design".
  writer_only: [exposure_budget_checked, halt_tripped, halt_released,
                scheduled_check_completed]
  # enums. Validated **where present** (whether one is missing is required's business).
  enums:
    verdict_provisional:
      role:    [gate, skeptic]
      lineage: [same-harness, cross-harness]
    admission_decided:
      verdict: [admit, reject, park]
    refutation_attempted:
      verdict: [refuted, survives]
      # The "root" class of a cause of death (Issue #104 / OBS-052). Recurrence detection
      # (learning.py repeats) walks past a same-root rewording under a whole-string match, so it is
      # **classified with a closed vocabulary at recording time**.
      # The vocabulary must be identical to DEATH_ROOTS in tools/learning.py (a test reconciles
      # them):
      #   placebo_test           the check does not measure the real path (test hardening, a
      #                          placebo test)
      #   declaration_drift      the declaration and the implementation diverged
      #   integration_base_moved the integration target moved and the premise broke
      #   self_written_premise   whoever is checked can write the check's premise
      #   other                  none of the above (supplement the root in the free-text cause).
      #                          **other is not a discriminating root** — the detector forms no
      #                          root group for it and falls back to string matching (so two
      #                          unrelated deaths are never escalated as "the same root")
      root: [placebo_test, declaration_drift, integration_base_moved,
             self_written_premise, other]
    result_retired:
      root: [placebo_test, declaration_drift, integration_base_moved,
             self_written_premise, other]
    rework_requested:
      root: [placebo_test, declaration_drift, integration_base_moved,
             self_written_premise, other]
    correction:
      kind:    [probe, mistake, backfill, superseded]
      effect:  [voids, records_backfill]
    phase_admitted:
      verdict: [pass, fail]
    goal_host_synced:
      native_state: [active, complete, blocked, unavailable, failed]
      assurance: [reported, observed]
    scheduled_check_completed:
      result: [ok, escalate]
  # types. As above, validated where present.
  types:
    correction:          { corrects: list, target_classes: list, target_issues: list }
    admission_decided:   { from_seqs: list, agreed_by: list }
    verdict_provisional: { issue: int_or_str }
    goal_blocker_observed: { evidence: list }
    goal_blocked:          { evidence: list, occurrences: int }
    goal_completed:        { evidence: list }
    adaptive_envelope_activated: { evidence: map, confidence: number,
                                   affected_critical_functions: list }
    adaptive_deviation_recorded: { artifacts: list, missing_evidence: list,
                                   tainted_artifacts: list, revalidation_scope: list }
    adaptive_envelope_reverted: { evidence: list }
    acceptable_outcome_recorded: { evidence: list }
    microexperiment_concluded: { evidence: list }
    circuit_state_changed: { evidence: list, confidence: number, retry_count: int,
                             retry_budget: int }
    operational_state_transitioned: { evidence: list, confidence: number }
    operational_escalated: { evidence: list, failures: int, retry_budget: int }
    artifact_tainted: { revalidation_scope: list }
    recovery_probe_recorded: { evidence: list, confidence: number }
    artifact_revalidated: { checks: list, evidence: list }
    scheduled_check_completed: { scheduled_for_min: int, exit_code: int }



event_classes:

  # metabolism (Organ 4)
  # candidate_id: WHICH backlog item this cycle is working (docs/09). Ties the cycle to the
  # candidate_submitted it drains, so "in flight" is per-item, not just a per-role count — and so a
  # cycle interrupted (e.g. by /clear) is recoverable: the work_in_progress view pairs the started
  # candidate with its latest progress_recorded. Absent ⇒ an untracked cycle (legacy / not backlog-driven).
  cycle_started:        { role, candidate_id, pack_manifest_id }
  # progress_recorded: the CHECKPOINT that survives a context wipe (docs/01 R−1: the org acts only on
  # what is written; a half-done implementation that lives only in the agent's context is lost on
  # /clear). Stamped at each milestone of a cycle: how far (0..1 or a phase label), what was just done,
  # the concrete next step, and any blocker. work_in_progress reads the LATEST per candidate; /org-resume
  # replays it to continue exactly where the cycle stopped. This is the backlog's memory of "how far".
  # bypass_declared: **the record that a tool was bypassed.** A path making the same state change
  # without going through an organ (a direct merge into a protected branch, say) is held by the
  # hook, but that would trap you when something breaks, so an explicit declaration
  # (`ORG_ALLOW_MANUAL_MERGE=1`) lets it through. **The declaration itself is left here** —
  # allowing an unrecorded bypass makes the declaration routine, and bypassing then accelerates out
  # of sight. It is the shape of recording what cannot be blocked.
  bypass_declared:      { what, command, declared_by }   # GUARD-BYPASS

  # asset_touched: **a change to a production asset.** exposure_budget_checked counts local file
  # operations but counts neither DDL against a remote DB, a production privilege change, nor an
  # infrastructure operation. The latter are in fact the more dangerous, and cost more to undo. In
  # the field two migrations and a privilege revoke went into the production DB while nothing was
  # left in the ledger — a state where "under whose authority did that revoke go in" cannot be
  # traced afterwards.
  #   target     : against what ("supabase:<project>", "gcp:<project>/<service>", …)
  #   op         : apply_migration / revoke / grant / drop / deploy / scale …
  #   reversible : whether it can be undone. false records that it went in knowing it cannot
  #   authority  : under whose authority (part of issue-N / an explicit CEO instruction / its own
  #                judgment)
  asset_touched:        { target, op, name, reversible: bool, authority, issue,
                          rollback }   # PRODUCTION-ASSET

  # public_surface_declared: **the surface exposed outward** in this cycle. cycle_completed's
  # domain_model asks "was a domain rule settled", while nobody was reading "what was exposed".
  # An authorization hole is born where "one function was added" (join_group in the field was
  # exactly that).
  #   surfaces: [{kind: db_function|endpoint|export|env, name, exposure, authz}]
  public_surface_declared: { role, issue, surfaces: [ {kind, name, exposure, authz} ],
                             none_asserted }   # ATTACK-SURFACE

  # correction: an append-only ledger cannot erase the past, so declaring an event "void" — one
  # written by mistake, or written for verification — is this event's job. A free-text note is
  # unreadable by machine, and status and learning cannot exclude it (in the field four probes were
  # counted as real judgments and the board diverged from reality). It points at the target seq
  # through corrects and the kind of reason through kind, both structured.
  #   kind: probe        — written to verify the specification; not a real judgment
  #         mistake      — written in error (the wrong subject or value)
  #         backfill     — filling in a record at its real time afterwards (the subject is still a
  #                        real judgment)
  #         superseded   — replaced by a later judgment
  # A correction is itself an append, so a correction can be corrected. Who voided it stays in
  # actor.
  correction:           { corrects: [seq], kind: probe|mistake|backfill|superseded, reason,
                          corrected_by, authority_role, authority_principal, authority_assurance,
                          authority_receipt_subject,
                          target_classes: [event_class], target_issues: [issue], issue,
                          effect: voids|records_backfill,
                          decision_by, recorded_by, identity_assurance, recorder_assurance,
                          workload_isolation, writer_isolation, signer_id, key_id }
                          # LEDGER-CORRECTION

  # ── the judgment classes (what `github_sync decide` accepts) ─────────────
  # **These were being written in real operation while the schema declared none of them.** It came
  # to light when Writer Phase 0's "an undeclared class cannot be written" check went in (the real
  # data held 5 design_decided and 23 rework_requested rows). An undeclared class rides on neither
  # a projection nor a sensor, so writing it leaves it unread — part of why `show`'s rework warning
  # went silent.
  # The shape follows the real data. **A declaration at odds with reality makes the check a lie.**
  design_decided:       { issue, deliverable, verdict, reasoning_sha256 }
  rework_requested:     { issue, deliverable, verdict, reasoning_sha256, phase, role,
                          candidate_id, requester, evidence_ref, reason, from_verdict, to_role, round,
                          risk_accepted,
                          root: "the root class of the cause of death (see validation.enums;
                                 optional) — Issue #104" }
  scope_decided:        { issue, deliverable, verdict, reasoning_sha256, phase, in_scope,
                          out_of_scope, reason }
  tradeoff_decided:     { issue, deliverable, verdict, reasoning_sha256, chosen, rejected, reason }
  deploy_decided:       { issue, deliverable, verdict, reasoning_sha256, phase }

  # ── the writer / schema boundary (Writer Phase 0) ────────────────────────
  # **The normative basis is each event's envelope `schema_version`**, not this record.
  # This is an aid to observability — it lets a human read "since when has validation been in
  # effect" off one line.
  # The condition is that verification remains possible from each event's version even if this
  # record is missing (B is optional; A is normative).
  #
  # Do not mix the two assurances. **Whether the schema is validated and whether the actor is
  # authenticated are independent properties**:
  #   validation_assurance:  legacy_unvalidated | validated:v1
  #   identity_assurance:    claimed | observed | attested | authenticated   ← not started
  schema_enforcement_started: { schema_id, first_validated_seq, note,
                          authority: "informational — the normative record of which validator
                                      applies is each event's own envelope schema_version" }

  progress_recorded:    { role, candidate_id, fraction, phase, done_so_far, next_step,
                          blocked_by, artifacts: [ref] }

  # Persistent objective state shared by every harness.  The ledger is the portable source of
  # truth; a host-native goal is an adapter projection whose synchronization assurance is recorded
  # separately.  `session_id` is a compare-and-swap ownership token: after SessionStart changes it,
  # work must append goal_resumed before progress/complete/block may mutate the goal.  This prevents
  # two old/new sessions from silently continuing one objective at once; it is coordination, not a
  # hostile-user identity boundary.
  goal_started:          { goal_id, objective, session_id, harness }
  goal_progressed:       { goal_id, session_id, summary, next_step, evidence: [ref] }
  goal_paused:           { goal_id, session_id, reason, next_step }
  goal_blocker_observed: { goal_id, session_id, blocker, evidence: [ref] }
  goal_blocked:          { goal_id, session_id, blocker, occurrences, evidence: [ref] }
  goal_resumed:          { goal_id, from_session_id, session_id, reason, harness }
  goal_completed:        { goal_id, session_id, summary, evidence: [ref] }
  # Native host state is not silently treated as fact.  Codex synchronization is skill-mediated;
  # Claude Code has no native Goal primitive.  `assurance` says whether the adapter merely reported
  # the state or observed the host result.
  goal_host_synced:      { goal_id, session_id, harness,
                           native_state: active|complete|blocked|unavailable|failed,
                           native_ref, detail, assurance: reported|observed }

  # Bounded field adaptation.  These events never change the constitution; they record an expiring
  # envelope activation, each actual deviation from WAI, and its disposition.  The adaptation tool
  # and ledger writer both evaluate the same constitution contract, so direct generic append cannot
  # turn an undeclared or expired deviation into a valid one.
  adaptive_envelope_activated: { envelope_id, envelope_version, trigger, source, activation_id,
                                 baseline_ref, evidence: {kind: ref}, confidence, expires_at,
                                 affected_critical_functions: [id] }
  adaptive_deviation_recorded: { envelope_id, activation_id, action, phase, artifacts: [ref],
                                 wai_baseline, reason, result, missing_evidence: [kind],
                                 tainted_artifacts: [ref], revalidation_scope: [check] }
  adaptive_envelope_expired:   { envelope_id, activation_id, reason }
  adaptive_envelope_reverted:  { envelope_id, activation_id, reason, evidence: [ref] }
  adaptive_envelope_adopted:   { envelope_id, activation_id, human_decision_ref,
                                 microexperiment_ref, practice_change_ref, decision_by, recorded_by,
                                 identity_assurance, recorder_assurance, workload_isolation,
                                 writer_isolation, signer_id, key_id }
  acceptable_outcome_recorded: { critical_function,
                                 outcome: verified_delivery|safe_stop|scope_reduction|
                                          goal_abandonment|human_handback|observe_only,
                                 envelope_id, activation_id, evidence: [ref], judged_by,
                                 judgment_required }
  microexperiment_concluded:   { experiment_id, envelope_id, hypothesis, result, evidence: [ref],
                                 judged_by }
  # Operational resilience is a ledger-backed state machine, not a second runtime. Circuit
  # observations feed state transitions; taint and revalidation prevent a successful probe from
  # silently blessing artifacts produced while controls were degraded.
  circuit_state_changed:       { circuit_id, dependency, from_state: CLOSED|OPEN|HALF_OPEN,
                                 to_state: CLOSED|OPEN|HALF_OPEN, reason, evidence: [ref], confidence,
                                 retry_count, retry_budget, cooldown_until, session_id,
                                 envelope_id, activation_id }
  operational_state_transitioned: { transition_id,
                                     from_state: NORMAL|DEGRADED|HALTED|RECOVERING,
                                     to_state: NORMAL|DEGRADED|HALTED|RECOVERING,
                                     circuit_id, reason, evidence: [ref], confidence, session_id,
                                     transitioned_by, envelope_id, activation_id }
  operational_escalated:       { circuit_id, failures, retry_budget, reason, evidence: [ref],
                                 route_to: human }
  artifact_tainted:            { artifact, cause_seq, circuit_id, envelope_id, activation_id,
                                 reason, revalidation_scope: [check] }
  recovery_probe_recorded:     { circuit_id, activation_id, result: pass|fail,
                                 evidence: [ref], confidence, session_id }
  artifact_revalidated:        { artifact, activation_id, checks: [check], result: pass|fail,
                                 evidence: [ref], verified_by, session_id }
  # accountable_supervisor (docs/09 §A1): which supervising role owns this output up the chain,
  # set from the runtime supervision edge (never the payload — a manager cannot forge who owns a
  # result, mirroring actor_identity_source). Empty for the top (human-owned) tier.
  # reused: the reusable_modules/parts this cycle PULLED FROM instead of re-authoring (docs/12 §5 #7).
  # Recorded so reuse is a visible, auditable fact ("I can see reuse happened, and how much it saved"),
  # not an invisible discipline — the factory compounds only if reuse actually fires.
  # domain_model: the enforcement that raises the SSoT floor (docs/11 §4d). A cycle that produced
  # code but touched no
  # domain model silently lets the context base rot (the co-commit discipline, docs/12 §3.3). So a
  # cycle_completed MUST state it, like exceptions_none_asserted: either it references the
  # convention_adopted / domain-model artifact this cycle co-committed, OR it explicitly asserts none was
  # established this cycle (a claim the skeptic can refute — "you changed the money-split rule and didn't
  # record it"). requires_prior rejects a cycle_completed missing this field, so "forgot to update the
  # domain model" cannot happen silently. It is what makes SDD run ON a growing context base, not in a vacuum.
  cycle_completed:      { role, candidate_id, tokens: {task, gate, reporting}, outputs: [ref],
                          reused: [ref], views_referenced: [view_id], accountable_supervisor,
                          domain_model: {updated: [ref], none_asserted: reason} }   # exactly one of updated / none_asserted
  heartbeat:            { component, invariants_hold: bool }
  # HALT. **Writer-only** (validation.writer_only) — only `ledger.py trip-halt` can write it.
  #
  # A halt is not a "warning" but the state of being stopped. Therefore:
  #   - the hook reads the ledger **every time**, confirms an active halt, and denies a gated
  #     action (it stops on the record, not on a declaration; reading only a declaration means
  #     deleting the declaration starts things again)
  #   - **a call that could not persist the halt is itself denied.**
  #     "Do not declare what cannot be recorded" is correct as recording and fail-open as control
  #   - a `<ledger-root>/HALT` latch sits as a second path. It stops things even when the ledger
  #     cannot be read.
  #     **Only a proper halt_released can remove the latch** — removing it by hand leaves the halt
  #     in the ledger, so the hook keeps stopping things (the latch is not a substitute for the
  #     ledger but insurance for when the ledger cannot be read)
  #   - **observation, verification, and safe repair** pass, so that recovery is possible (denying
  #     everything makes recovery impossible). Ordinary work is stopped
  #
  # scope: global = the whole org. role = that role's acts only (H4a implements global only).
  halt_tripped:         { trigger, scope: global|role, reason, tripped_by, latch_written }
  # The release. **Not implemented in H4a** — it needs an approval independent of whoever tripped
  # it, and that depends on identity authentication (H1). Deciding "who may release" here from an
  # actor's self-declaration would let whoever stopped it release it silently. The declaration goes
  # in first; the writable operation is added in H4b.
  halt_released:        { releases_seq, reason, released_by, recovery_verified, tripped_by,
                          identity_assurance, recorded_by, recorder_assurance,
                          signer_id, key_id,
                          authority: "requires an approver INDEPENDENT of tripped_by, holding an
                                      asymmetric key authorized with may_release_halt. A shared
                                      secret proves only that a key differs — not that a distinct
                                      principal approved. Order: verify → append+fsync → THEN clear
                                      the latch; if the latch cannot be cleared the halt STAYS." }
  # work (Organs 2/6)
  # source: how this backlog item entered the department's backlog (docs/09, docs/03). `mandate` =
  # a top-down instruction handed down; `self` = a self-generated task the department raised from its
  # own aspiration gap (problemistic search). Both land in the SAME backlog (open_experiments) and are
  # prioritized on one footing by attention.py; source only lets a mandate carry a floor (zone of
  # acceptance, Simon 1947) and lets an audit see where work came from. Absent ⇒ treated as `self`.
  candidate_submitted:  { maker, candidate_id, contract_ref, evidence: [ref], source: mandate|self }
  # predicted_outcome: the gate's expected result for this admission — the input the OUTCOME-DELTA /
  # FRAME-REVIEW organs (learning.py, alignment.py) join against the realized outcome (docs/05 §5.4,
  # docs/05 §5.4). Declared here so the emitting role knows to populate it; the organs are inert
  # (silently) without it.
  # reasoning_sha256 + issue (docs/11 §4f.1): with human review retired the Issue comment holds the
  # ACCOUNT of why the change merged, and a GitHub comment is editable by the very agents it judges.
  # The digest is what makes that account tamper-EVIDENT — re-hash the comment and compare. Both
  # judgment classes also carry a runtime distinct-actor rule (ledger.py DISTINCT_ACTOR): the actor
  # recording a verdict must not be the actor whose work it judges, and the skeptic must differ from
  # the gate. Without it a maker could self-admit and the chain would launder the forgery.
  admission_decided:    { gate, candidate_id, verdict: admit|reject|park, standard_ref,
                          predicted_outcome, evidence: [ref], issue, reasoning_sha256,
                          decision_by, recorded_by, committed_by,
                          identity_assurance, recorder_assurance, workload_isolation,
                          reviewer_independence, agreed_identity_assurance, signer_id, key_id,
                          lineage: "same-harness|cross-harness|joint — `joint` means generated from two
                                    agreeing verdict_provisional records, not placed by one judge",
                          agreed_by, from_seqs, review_subject_id, review_subject,
                          reasoning_by_lineage: "per-lineage {seq, reasoning_sha256, reasoning_ref} —
                                                 the joint digest is derived from BOTH, so neither
                                                 side's account can go missing",
                          distinct_actor: "actor != the actor of cycle_started/cycle_completed for this candidate" }
  refutation_attempted: { skeptic, claim_id, verdict: refuted|survives, checklist_ref, issue,
                          reasoning_sha256, lineage,
                          root: "the root class of the cause of death (see validation.enums;
                                 optional, on refuted) — Issue #104",
                          distinct_actor: "actor != the maker's and != the admitting gate's" }
  # ── the judgment receipt (H1) ────────────────────────────────────────────
  # A judge's signature over its own judgment. **The supervisor only carries it**, and the judge's
  # identity is not lost.
  # So "proxy recording" and "authentication" coexist — what is needed is not a direct append by
  # the judge but **a judgment receipt that cannot be altered**.
  #
  # The receipt binds everything below. **Reuse against another org, another subject, or another
  # lineage is refused** — a value that is not bound can be swapped afterwards.
  judgment_receipt:     { receipt_id, org_id, ledger_id, review_subject_id,
                          issue, role, phase, lineage, verdict,
                          requirements_digest, reasoning_sha256,
                          signer_id, key_id, issued_at,
                          schema_version, protocol_version, signature,
                          authority: "decision_by is set from a VERIFIED receipt only — never from a
                                      CLI flag. A receipt bound to another org/subject/lineage is
                                      refused, so it cannot be replayed into a different judgment." }

  # Cross-harness judge key custody.  The judge creates the private key in its own
  # execution boundary; the writer records only this public registration.  A
  # registration is evidence of the key advertised to the writer, not a DR
  # semantic verdict or an independence decision.
  judge_key_registered: { key_id, signer_id, public_key_digest, role, lineage,
                          registered_by, registration_reason }

  # ── the judges' lineage (the Swiss-cheese layers. docs/03 §3, docs/11) ───
  # A subagent in the same harness inherits the parent's model, so declaring a different family in
  # `role-settings.yaml` does not separate the lineage. An org that declares
  # `enforcement.judges.lineage: cross-harness` in its constitution runs two judges, and
  # **only agreement generates an admission**.
  #
  # So admit/survives **cannot be appended directly**. Each lineage's judgment is placed as a
  # verdict_provisional, and once the two agree the tool assembles
  # admission_decided{lineage: joint}. Producing the verdict at stage 2 is plumbing, not judgment
  # (a function of the fact of agreement). **Where they disagree the tool cannot produce an
  # admit.**
  verdict_provisional:  { role: gate|skeptic, lineage: same-harness|cross-harness,
                          verdict, for_event, issue, deliverable, reasoning_sha256, reasoning_ref,
                          # phase enters the receipt's binding (which stage judged it)
                          phase,
                          decision_by, recorded_by, committed_by,
                          identity_assurance, recorder_assurance, workload_isolation,
                          # **the writer's isolation is not the judge's.** Separate fields (0.39.2).
                          writer_isolation,
                          signer_id, key_id, risk_accepted,

                          review_subject,

                          review_subject_id: "digest of (issue, role, phase, integration_ref,
                                              integration_head_sha, base_sha, reviewed_tree_sha,
                                              dirty, requirements_digest) — generated
                                              ONCE by `verify`, never by the judge. Two verdicts with
                                              different subjects looked at different artefacts and
                                              therefore do NOT agree",
                          review_subject: "observable descriptor bound by review_subject_id; includes
                                           integration ref/head, base relation, reviewed tree, and
                                           requirements digest so freshness can be rechecked when the
                                           verdict is recorded and when joint admission is derived",
                          authority: "NONE on its own — a single lineage's verdict is material, not a decision",
                          one_per: "(issue, for_event, lineage) — a lineage may not rewrite its verdict to
                                    manufacture agreement; correct via `correction`" }
  judges_disagreed:     { issue, deliverable, role, for_event,
                          same_harness: verdict, cross_harness: verdict,
                          decision_by, recorded_by, committed_by,
                          identity_assurance, recorder_assurance, workload_isolation,
                          # **the writer's isolation is not the judge's.** Separate fields (0.39.2).
                          writer_isolation,
                          signer_id, key_id,

                          note: "NOT an anomaly — this is the POINT of separating lineage. Never deleted;
                                 counted. Whichever side says no, stands (the strict side wins)." }
  # ── SDLC phase mold (docs/11) — the forced, non-skippable phase chain, reproducibility's spine ──
  # A deliverable travels requirements → design → implement → test → integrate → deploy → operate. Each phase is
  # ENTERED by phase_started and CLEARED by phase_admitted{verdict:pass}. The chain is enforced by the
  # SAME requires_prior idiom as result_deployed: phase_started{P} is INVALID unless a
  # phase_admitted{prior(P), pass} exists for the deliverable. prior(requirements)=∅. This is what makes
  # the PROCESS reproducible: same spec ⇒ the same phases run in the same order for every founder/run.
  # The existing test→integrate→deploy gate (result_deployed requires survives) and design→implement conformance
  # (conformance_reviewed) are the two hardest phase boundaries, already enforced below; these two
  # events extend the identical mechanism to the earlier boundaries.
  # parent (optional): the parent objective of a task's deliverable. A founding admits
  # requirements/design per objective, so a task follows this to inherit the parent's admit.
  # Without one it reads only its own admit (as before).
  phase_started:        { deliverable, parent, phase: requirements|design|implement|test|integrate|deploy|operate, role,
                          requires_prior: "phase_admitted{deliverable==deliverable, phase==prior(phase), verdict==pass} (∅ for requirements)" }
  phase_admitted:       { deliverable, phase: requirements|design|implement|test|integrate|deploy|operate,
                          verdict: pass|rework|reject, evidence_ref, admitter }
  # integrate phase (docs/11 §4c): the fanned-out siblings merged to `develop` and pass the COMBINED
  # suite together. Green CI on develop is its machine form; result_deployed should require it (the
  # develop→main promotion). Owned by the supervising manager (A3 extended to cross-deliverable).
  # `candidate_id`/`issue` are optional but LOAD-BEARING when present. `candidate_id` (written by
  # orgcycle/ship.py since #102 rework #2) names WHICH candidate this integration finished — the
  # work_in_progress view then frees exactly that slot, so a parallel sibling on the same issue or
  # a later rework start is never silenced by correlation guesswork. `issue` is the legacy bridge:
  # ledgers whose integrations lack candidate_id (all pre-#102, incl. Tatekae) are correlated
  # candidate_id ↔ issue via aliases, temporally. Undeclared, either field would be one emitter
  # cleanup away from silently breaking the OBS-050 fix.
  integration_admitted: { integration_branch, integration_subject_sha, deliverables: [ref],
                          combined_ci_ref, verdict: pass|fail, admitter, candidate_id, issue }
  # A result may only deploy AFTER the skeptic refuted-and-failed (verdict: survives) for it.
  # requires_prior makes the skeptic load-bearing: without a `survives` for this candidate_id,
  # a result_deployed event is INVALID (the deploy path cannot skip adversarial review).
  # observed_outcome: the realized result the organs diff against predicted_outcome (docs/05 §5.4).
  result_deployed:      { candidate_id, net_effect_ref, observed_outcome,
                          requires_prior: "refutation_attempted{claim_id==candidate_id, verdict==survives}" }
  result_retired:       { candidate_id, cause, observed_outcome,
                          root: "the root class of the cause of death (see validation.enums;
                                 optional). A classification made at recording time so that a
                                 rewording of the free-text cause does not walk past recurrence
                                 detection (learning.py repeats) (Issue #104 / OBS-052)" }
  # structure (Organ 7 / moves)
  sensor_reading:       { sensor, value, window, inputs_ref }
  move_executed:        { move_id, tier, diff_ref, precondition_evidence: [sensor_reading.id], lint_report_ref }
  proposal_filed:       { subject, diff_ref, diagnosis, expected_effect, dedup_key }
  proposal_adjudicated: { proposal_id, decision: approve|reject|amend, human }
  irreversible_staged:  { action_class, effect_diff_ref, checker_signature }
  irreversible_executed: { staged_id, human }
  # SILENCE-CONSENT (docs/05 §2.1): may a backlog action proceed on silence, or hold for an ack?
  # Reversible => delegated tier (silence is consent); irreversible => irreversible-hold (ack).
  consent_decided:      { action_class, item_ref, reversible: bool, tier: delegated|irreversible,
                          decision: silence_is_consent|explicit_ack_required }
  # profiles, doctrine, scopes (Organs 3/5, docs/06-08)
  profile_edited:       { role, diff_ref, editor, section: body|preamble }
  doctrine_diff_admitted: { role, claims: [{claim, provenance: {source, retrieved_at, confidence}, review_by}] }
  intelligence_filed:   { curator, item_ref, provenance, affected_roles }
  scope_grant_changed:  { seam: {from, to}, change: open|widen|narrow|revoke, grantor }
  intent_revised:       { version, diff_ref, human }
  refounding_committed: { old_structure_ref, new_structure_ref, doctrine_remap: {old_role: new_role},
                          unmapped_claims_surfaced: [claim_id], human }   # docs/05 §4.4 — atomic re-found,
                          # assets intact: the ledger persists, doctrine is re-mapped, none orphaned
  digest_generated:     { window, census: {class: count}, exceptions_ref }
  anomaly_detected:     { detector, description, matched_pattern: pattern_id|none }
  # operating events (docs/05) — the recurring checks a 24/7 unattended org needs beyond
  # founding. Each obeys reconcile-by-exception: the silent path emits the event as an audit
  # breadcrumb; only the exception routes up. §2.1–2.3 have running code (tools/guardrails.py).
  # BLAST-RADIUS-CAP. **Writer-only** (validation.writer_only) — only `reserve-exposure` can write
  # it. Writable by an ordinary append, one negative exposure row would void the cap.
  # session_id / tool_use_id / rule / request_digest exist for idempotency:
  #   the key is the hash of the canonical tuple (session_id, tool_use_id, rule, class)
  #   request_digest is a digest of the request's content (dimension/delta/cap/window/actor) —
  #   **a request with the same key and different content is not a re-run**, so it is refused as a
  #   conflict
  exposure_budget_checked: { window_id, dimension, committed_so_far, delta_requested, cap,
                             actor_role, decision: allow|hold, caused_by_event,
                             session_id, tool_use_id, rule, request_digest }
  # ITERATION/SPEND-CAP (docs/10 §1, docs/12 §5 #2): a role's loop cycles + cumulative tokens per window;
  # HOLDs a runaway loop the blast-radius cap can't see (reversible read-think-edit spinning forever).
  iteration_budget_checked: { window_id, role, cycles_so_far, tokens_so_far, max_cycles, max_tokens,
                              decision: allow|hold, limiting }
  # RELIABILITY-BUDGET (docs/05 §reliability-budget): an SRE error budget (100%−SLO) that bounds
  # DEPLOY velocity — a sibling of BLAST-RADIUS-CAP (aggregate limit over a window) but a DIFFERENT
  # axis: blast-radius meters irreversibility per act; this meters reliability BURN and FREEZES deploys
  # when the budget is spent. The docs/11 deploy gate reads it (result_deployed also gates on a healthy
  # budget). Emitted on each deploy-gate check; the exception (budget exhausted) routes up.
  reliability_budget_checked: { service, slo, window_id, budget_total, budget_burned, budget_remaining,
                                deploy_verdict: allow|freeze, caused_by_event }
  # DORA (docs/05 §DORA): the four keys — deploy frequency, lead time, change-fail rate, MTTR — as the
  # named/instrumented generalization of OUTCOME-DELTA. The org's navigation instrument for the moving
  # bottleneck (Theory of Constraints, docs/12 §3). A periodic snapshot; a regressed key routes up.
  dora_snapshot: { window_id, deploy_frequency, lead_time_p50, change_fail_rate, mttr_p50,
                   inferred_bottleneck: design|review|test|deploy|operate, delta_vs_prior }
  # CIRCUIT-BREAKER (docs/12 §5 #3): trips when a candidate's progress_recorded stream stops advancing
  # (identical next_step repeated, or fraction flat) — flag for a human, free the WIP slot.
  stall_breaker_checked: { candidate_id, role, checkpoints, repeat_run, no_advance_run,
                           decision: trip|ok, reason }
  # REPEATED-DEATH (docs/06, docs/12 §5): a death cause reappeared on a later candidate — the org
  # re-made a mistake it had recorded, i.e. accumulated learning was NOT fed forward. The direct
  # measure that "the team's output quality rises over time" is holding (or not).
  repeated_death_detected: { cause, occurrences, candidate_ids: [ref] }
  # PROVEN-ROLLBACK (docs/05 §4, docs/12 §5): a reversible action must carry a declared undo, or its
  # reversibility is an untested claim the silence-consent tier must not trust.
  rollback_declared:    { action_ref, undo }
  rollback_unproven:    { action_ref, reason }
  state_reconciled:     { domain, expected_value, observed_value, drift: bool, magnitude,
                          unaccounted_events: [ref] }                              # STATE-RECONCILED
  reference_staleness_checked: { trigger_event, bound_roles: [role], stale_roles: [role],
                                 silent_duration_per_role, result: all_current|stale_found } # STALE-REFERENCE
  # lateral reconciliation family (docs/05 §2.4) — DESIGN, not yet coded. The horizontal seam
  # no other organ watches; shared shape unifies the three timings of peer divergence.
  work_claimed:         { role, work_territory, intent_summary,
                          depends_on: [{producer_role, seam_id}] }                 # COLLISION-SCAN (claim); depends_on = the blocked-on edges DEPENDENCY-STALL reads
  # claim_released: closes a work_claimed so the spawn-time non-collision gate (org_hook) stops treating
  # the territory as live. A cycle_completed/result_* on the same territory also closes it implicitly.
  claim_released:       { role, work_territory }
  lateral_reconciled:   { observer_role, subjects: [role], reference, result: consistent|divergent,
                          divergence_kind: duplicate|contradiction|stall|breaking_change,
                          evidence_event_ids: [ref] }
  dependency_stall_raised: { blocked_role, awaited_seam_id, awaited_producer_role,
                             stalled_ticks, downstream_impact: [ref], route_to }   # DEPENDENCY-STALL; route_to = lowest common owner
  contract_change_proposed: { seam_id, producer_role, current_hash, proposed_shape,
                              is_breaking: bool, dependents: [role], objection_deadline_tick } # CONTRACT-CHANGE
  # resource, learning, and the schedule planner (docs/05 §5.4, §5.6)
  priority_ranking_set: { ranking_id, ordered_objectives: [{objective_id, rank, weight,
                          rationale_hash}], supersedes, basis_event_ids: [ref] }   # PRIORITY-RANKING
  allocation_reclaimed: { holder, resource_type, from_level, to_level, yield_metric,
                          ranking_ref, reason }                                     # ALLOCATION-RECLAIM
  authority_reviewed:   { grants_reviewed, auto_narrowed: [ref], renewed: [ref] }   # AUTHORITY-EXPIRED
  outcome_delta:        { decision_event_id, predicted_outcome, observed_outcome,
                          delta_magnitude, delta_sign, department, recurrence_count } # OUTCOME-DELTA
  tick_planned:         { now_min, night: bool, due: [check_id], suspended: [check_id],
                          missed: [check_id] }   # tick.py's own run — a gap proves the host cron died
  scheduled_check_completed: { check_id, scheduled_for_min, execution_id,
                               result: ok|escalate, exit_code, command_sha256,
                               plugin_version } # proof the scheduler ran a check; never its domain result
  # intra-department attention allocation (docs/09) — how ONE dept picks what to work on next
  attention_allocated:  { role, wip_limit, in_flight, ranking_id,
                          selected: [{candidate_id, objective, score, in_ranking, source}],
                          deferred: [{candidate_id, score}], reason }   # ATTENTION-ALLOCATION
  # proxy-stack guards (docs/05) — is the org still solving the RIGHT problem?
  premise_reconciled:   { premise_id, asserted, observed, status: holds|weakened|broken } # PREMISE/TELOS
  sunk_course_reviewed: { course_id, attempts, cost, outcome_trend, still_open: bool,
                          decision: continue|abandon }                          # SUNK-COURSE (Staw)
  frame_review_raised:  { near_target_decisions, result_trend, question }        # DOUBLE-LOOP (Argyris)
  mandate_conflict_raised: { subjects: [role], contested_decision, mandate_refs: [role],
                             resolution: precedence_applies|integrate|escalate, evidence_ids: [ref] } # MANDATE-CONFLICT
  convention_adopted:   { scope, settled_choice, owner, review_by }              # internal precedent (Nelson&Winter)
  # manager accountability (docs/09) — the VERTICAL control down the supervision edge, distinct
  # from the gate/skeptic's cross-cutting admission (docs/09 §honest-distinction).
  # spec_delegated (docs/09 §spec-driven): the manager pushes the per-task intent DOWN as an explicit
  # spec BEFORE work starts (Deming's acceptance-spec), with a token_budget carved from its own —
  # the producer of conformance_reviewed.delegated_intent_ref. confirmed == the supervisor affirms
  # the spec conforms to the intent it holds (down-front A3). token_budget is how granularity is
  # controlled: a subordinate spawns within its budget (~1 agent per ~50k tokens, measured), so the
  # budget — not a depth/width knob — sets how deep/wide the sub-tree grows (docs/09 §granularity).
  # spec_ref is the TASK ISSUE (its #/URL) — the spec lives in the Issue body (template/SPEC.md is the
  # Issue structure), NOT a docs/spec/*.md file. The SSoT is the ledger + org spec; the task spec is
  # working detail in the Issue, and this event just points at it (no fragment-Spec files, docs/12 §3.3).
  spec_delegated:       { supervisor, subordinate, spec_ref, contract_ref, intent_basis_ref,
                          token_budget, confirmed: bool }                        # spec-driven + budget
  conformance_reviewed: { supervisor, subordinate, reviewed_ref, delegated_intent_ref,
                          verdict: conforms|rework|reject, evidence_ref }        # A3 intent-conformance
  # report_up is INVALID without a prior conformance_reviewed{conforms} for each subordinate result
  # it rolls up — the manager cannot own unverified work upward (requires_prior, as result_deployed
  # requires a skeptic survives). exceptions_none_asserted makes silence a positive claim (anti-MUM).
  report_up:            { supervisor, parent, window, basis_refs: [ref],
                          intent_status: met|at_risk|missed, exceptions: [ref],
                          exceptions_none_asserted: bool, decisions_needed: [ref],
                          requires_prior: "conformance_reviewed{verdict==conforms} for each rolled-up result" } # A4 honest roll-up

# ── Cadence triggers: what `loop.cadence: on_<x>` may bind to ────────────────
triggers:
  candidate_arrival:      candidate_submitted
  positive_result:        admission_decided   # filtered verdict == admit
  handover_preparation:   move_executed       # filtered move_id == prepare_handover
  operator_instruction:   human               # out-of-band; runtime-delivered

# ── Derived views: the ONLY vocabulary of context packs and scope grants ─────
# Each view: which classes it derives from, and its shape. Regenerated, never edited.
views:
  live_findings:        { from: [admission_decided, result_deployed], shape: currently-admitted results and their state }
  nearby_deaths:        { from: [admission_decided, refutation_attempted, result_retired], shape: recent rejections/refutations adjacent to the reader's contract, with causes }
  death_causes:         { from: [admission_decided, result_retired], shape: aggregated failure causes }
  coverage_map:         { from: [candidate_submitted], shape: searched vs unsearched territory }
  parked_inventory:     { from: [admission_decided], shape: verdict == park, with park reasons }
  parts_inventory:      { from: [admission_decided, result_retired], shape: admitted orthogonal components }
  combination_history:  { from: [candidate_submitted, admission_decided], shape: tried combinations and outcomes }
  open_experiments:     { from: [candidate_submitted, cycle_completed], shape: backlog awaiting execution }
  work_in_progress:     { from: [cycle_started, progress_recorded, cycle_completed,
                                 candidate_submitted, integration_admitted, correction],
                          shape: candidates STARTED but not yet finished — finished means cycle_completed, OR the same work integrated (integration_admitted verdict pass, correlated via candidate_id↔issue aliases), OR the start voided by a correction — each with its latest progress checkpoint (how far / next step / blocker); the recovery source after a context wipe (/org-resume). Without the integration/void arms an integrated candidate holds a WIP slot forever (OBS-050) }
  goal_state:           { from: [goal_started, goal_progressed, goal_paused,
                                 goal_blocker_observed, goal_blocked, goal_resumed,
                                 goal_completed, goal_host_synced],
                          shape: the one portable persistent goal, its owning session, latest progress,
                                 blocker observations, evidence, and host-adapter synchronization }
  adaptive_envelope_status: { from: [adaptive_envelope_activated,
                                     adaptive_deviation_recorded, adaptive_envelope_expired,
                                     adaptive_envelope_reverted, adaptive_envelope_adopted,
                                     acceptable_outcome_recorded, microexperiment_concluded],
                              shape: current proposed/active/expired/reverted/adopted envelopes,
                                     exposed critical functions, taint, revalidation, missingness,
                                     and acceptable outcomes without a synthetic resilience score }
  operational_state: { from: [halt_tripped, halt_released, adaptive_envelope_activated,
                              adaptive_envelope_expired, adaptive_envelope_reverted,
                              circuit_state_changed, operational_state_transitioned,
                              operational_escalated, artifact_tainted, recovery_probe_recorded,
                              artifact_revalidated],
                       shape: effective NORMAL/DEGRADED/HALTED/RECOVERING state, dependency circuits,
                              owning session, taint, required revalidation, escalation, and evidence }
  reusable_modules:     { from: [cycle_completed], shape: shared implementation assets }
  gate_input_spec:      { from: [intent_revised, proposal_adjudicated], shape: the current candidate submission format }
  doctrine_gaps:        { from: [doctrine_diff_admitted, cycle_completed], shape: roles whose doctrine is thin or expiring }
  doctrine_ttl_board:   { from: [doctrine_diff_admitted], shape: claims by review_by date }
  watch_sources:        { from: [intelligence_filed, doctrine_diff_admitted], shape: declared external sources and their yield }
  direction_flags:      { from: [cycle_completed, sensor_reading], shape: per-role direction verdicts for the supervisor }
  sensor_readings:      { from: [sensor_reading], shape: latest value per sensor with window }
  ledger_census:        { from: ["*"], shape: counts of every event class, all time }
  recent_ledger_census: { from: ["*"], shape: counts of every event class, current window }
  admission_standard:   { from: [intent_revised, proposal_adjudicated], shape: the purpose-grounded standard, current version }
  candidate_under_review: { from: [candidate_submitted], shape: the one candidate the gate is judging, full submission }
  claim_under_review:   { from: [admission_decided], shape: the admitted positive under adversarial review }
  refutation_checklist: { from: [intent_revised, proposal_adjudicated], shape: the skeptic's current battery }
  full_evidence_trail:  { from: ["*"], shape: everything touching the item under review — control roles only }
  moves_catalog:        { from: [proposal_adjudicated], shape: current legal moves (mirror of moves.yaml at its adopted version) }
  proposal_queue:       { from: [proposal_filed, proposal_adjudicated], shape: open proposals by subject }
  pending_conformance_review: { from: [cycle_completed, conformance_reviewed], shape: subordinate outputs a supervisor owns (accountable_supervisor) but has not yet conformance-reviewed — an over-span manager's unreviewed backlog (docs/09 §A3) }

# ── Context-pack assembly (docs/07; executed by the registrar) ───────────────
context_pack:
  algorithm: |
    1. intent block, by reference to its latest intent_revised version (never copied).
    2. the role's current doctrine (doctrine_diff_admitted, folded; TTL-expired claims flagged).
    3. each view granted to the role in organization.yaml information_flow.scopes.grants,
       rendered fresh from the ledger.
    4. budget check: if the rendered pack exceeds pack_budget_tokens, summarize the
       overflowing views and attach ledger refs for pull-based drill-down — never
       silently truncate, never drop the intent or the contract.
    5. write a pack manifest (what was included, which versions, what was summarized)
       and ledger it via cycle_started.pack_manifest_id.
  # the only non-view pack entries — the single source of truth is
  # organization.yaml information_flow.universal_pack_items (which the lint reads); do NOT
  # duplicate the list here (two copies drift). Named there, referenced here.
  special_pack_items: see_organization.universal_pack_items
  pull_interface: a role may query any view it is GRANTED, mid-cycle, for drill-down;
    queries outside its grants are denied and ledgered (blocked_on_missing_context feeds
    on these denials)

# ── Proposal (approval-queue) item & digest shapes ───────────────────────────
proposal_item:
  fields: { subject: one_charter_item, diff_ref, diagnosis, expected_effect, dedup_key }
  rules_ref: constitution charter.queue_rules
digest:
  deterministic: true              # same window + same ledger ⇒ byte-identical digest
  sections:
    - census: counts of EVERY event class in the window (mandatory, uncurated)
    - reorg_commits: all move_executed with diffs
    - open_proposals: proposal_queue view
    - held_irreversibles: irreversible_staged not yet executed
    - anomalies: anomaly_detected + any census count outside its trailing band
    - budget_report: tokens by role and category vs caps
