# constitution.yaml — THE DECISION LINE, ARTICULATED.
#
# This is the load-bearing file for a 24/7 AI organization. A human CEO does not adjudicate
# every judgment — the art of running a company is drawing the line between "this I decide"
# and "this the field is trusted to decide," and delegating the thousand small calls so the
# top can focus on the few essential ones. Humans draw that line by feel. An AI cannot feel
# it — so here it is WRITTEN DOWN: for every kind of decision, whether the AI runs it now, or
# raises it and keeps working, or prepares it and waits for the human. That is what lets the
# system run around the clock with the human deciding only what actually matters.
#
# (This articulated decision line also happens to be the control skeleton — separating what
# self-organizes from what the human governs, docs/03. But its PURPOSE is delegation, not
# audit: it exists so the human is freed to the essential decisions, not to catch cheats.
# Calibrate it to risk — full ceremony for high-stakes/irreversible work, light touch for
# cheap reversible work; see docs/01 §5. Over-governing every trivial call
# recreates the bottleneck delegation was meant to remove.)
#
# organization.yaml is the org chart (the division of labor) — the org may rewrite it through
# moves.yaml, within these bounds. THIS file is the articles of incorporation: written by
# humans, readable by every agent, writable by NO agent.
#
# Three authorization tiers (docs/06 §2.1). Every action falls in exactly one. Tier BEHAVIOR
# is fixed in docs/06; the authoritative ITEM LISTS are here and only here.
# Overnight: delegated → execute now; charter → raise a proposal and keep working;
# irreversible → prepare fully, hold for the human.
#
# NOTE: values below are a worked example. Replace them; the audit lint fails on any
# leftover "SET_ME"-style placeholder in an instance.

# ── Tier 1: DELEGATED — execute immediately, record in ledger ────────────────
delegated:
  # The exploration front's entire organic space (docs/03 §4): decomposition, methods,
  # hypothesis generation, effort allocation, lateral communication within granted seams.
  exploration: unrestricted_within_budget
  # Structural moves the org may make on its own. This list MUST match moves.yaml
  # entries with `tier: delegated` — the lint cross-checks both directions.
  structural_moves:
    - activate_department          # within span budget; never activates around SoD
    - deactivate_department        # never a control role while exploration is active
    - widen_span_via_context
    - edit_organic_profile         # supervisor coaching — ORGANIC roles, non-preamble sections only
    - delegate_authority
    - add_coordination_gate
    - lighten_gate                 # never the admission gate — lint-guarded
    - remove_layer                 # only if the parent passes the post-merge span check
    - update_doctrine              # organic-role doctrine, after gate admission (docs/07)
    - adjust_context_scope         # organic↔organic seams only (docs/08)
  # Night operation: what delegated authority looks like unattended.
  night:
    exploration_token_cap_per_window: 2000000   # tokens per 8h window — example, set your own
    no_progress_rule:
      same_signal_same_move_max: 3     # then suspend that line and file ONE proposal (dedup'd)
    safe_mode:                          # FAIL-SAFE, not fail-open (docs/06 §2.4)
      # HOW THIS IS ENFORCED (docs/01 §5 tiers; docs/09 §5): for a Tier-A org, the night
      # admission default is enforced STRUCTURALLY + BY THE APPROVAL QUEUE — no department's
      # projection gives it its own admission authority, so a surprise cannot be self-admitted.
      # For a Tier-B (asset-touching) org, the HOST ENVIRONMENT additionally provides the
      # sandboxing/custody that makes "suspend on surprise" tamper-resistant. The constitution
      # DECLARES the requirement; the chosen host satisfies it (docs/01 R2, C4).
      admission_default: suspend        # admission proceeds ONLY on exact pre-registered
      admit_only_on: exact_preregistered_sensor_match   # sensor matches; surprises suspend
      exploration: continue             # making stays cheap and reversible
      classification_of_signals: mechanistic_and_ledgered  # the org cannot relabel a
                                                           # surprise as "defined" to keep admitting

# ── Tier 2: CHARTER (approval queue) — agents propose, humans decide ──────────
# Inspired by the written-proposal aspect of 稟議 (ringi): agents propose in writing with
# diagnosis + diff + expected effect; one accountable human adjudicates. No consensus round.
charter:
  items:
    - founding_commit                   # the org cannot be born without human sign-off (docs/06 §1)
    - separation_of_duties_matrix       # the SoD map in organization.yaml
    - mechanistic_role_profiles         # gate, skeptic, supervisor, registrar job descriptions
    - profile_discipline_preambles      # the immutable block in EVERY profile (ROLE.md), any regime
    - admission_standard                # what "passing" means (Organ 1 grounding)
    - mechanistic_role_doctrine         # what the control layer is taught (docs/07)
    - control_layer_context_scopes      # a maker may never scope-fence its Checker (docs/08 §4)
    - intent_block_revision             # org-wide priorities under an unchanged purpose (docs/08 §2.1)
    - purpose_revision                  # Organ 1 is human-held, always
    - delegation_bounds                 # this file's Tier-1 contents themselves
    - moves_catalog                     # adding/changing legal moves
    - add_layer                         # hierarchy is charter-tier: the last resort
    - lifecycle_transitions             # enter_maintenance, prepare_handover
  queue: ledger://proposals             # append-only; adjudicated each morning
  queue_rules:                          # anti-flooding, anti-bundling (docs/06 §2.2)
    one_concern_per_proposal: true      # multi-subject diffs are auto-rejected and split
    one_open_proposal_per_subject: true
    dedup_identical_diffs: true
    batch_adjudication_of_charter_items: false   # each gets its own human read, untimed
  morning_digest:
    generated_by: registrar             # mechanistic clerk (docs/06 §2.6)
    deterministic_projection: true      # anyone re-running it gets the same document
    mandatory_census: all_ledger_event_class_counts   # activity cannot be hidden by curation
    then_exceptions: [reorg_commits, open_proposals, held_irreversibles, anomalies, budget_report]
    human_read_budget_minutes: 15       # applies to the digest ONLY — never to charter decisions

# ── Tier 3: IRREVERSIBLE HOLD — prepare fully, execute only on human approval ─
irreversible:
  held_actions:
    - production_deploy
    - external_publication              # anything leaving the boundary is published
    - asset_movement                    # funds, credentials, data exports
    - ledger_schema_change
    - sunset                            # the org never adjudicates its own death (docs/06 §4.3)
  prepare_up_to: staged_and_verified    # build, test, stage, diff — approve-only state
  staging_guards:
    no_asset_materialization_at_boundary: true   # staging stops BEFORE secrets/data/funds
                                                 # are assembled at the edge
    max_concurrent_held_per_class: 3             # the night cannot stage 50 to swamp review
    each_held_action_carries: checker_signed_effect_diff

# ── Knowledge & context rules (docs/07, docs/08) ─────────────────────────────
knowledge:
  external_content_is_untrusted: true   # nothing external enters always-loaded context
  doctrine_admission: gate              # without mechanistic admission (anti-poisoning)
  provenance_required: [source, retrieved_at, confidence, affected_roles]
  doctrine_claims_carry_ttl: true       # stale doctrine fires the doctrine_stale sensor
  self_serving_doctrine_is_charter: true  # a diff touching the proposer's own discipline
                                          # or any threshold the gate uses is charter-tier
context:
  scopes_default: deny                  # need-to-know (docs/08 §2.2)
  grants_recorded_in_ledger: true
  grant_recertification_cadence: weekly # unused grants are revoked
  intent_block_in_every_pack: true      # no role is "not cleared" for the purpose
  pack_budgets_enforced_by: registrar

# ── Escalation channels — strictly two, never mixed ─────────────────────────
escalation:
  digest: [reorg_commits, open_proposals, held_irreversibles, anomalies, budget_report]
  wake_up_push: [global_halt, safety_limit_tripped, ledger_anomaly]   # nothing else
  watchdog:                             # docs/06 §2.4 — the backstop is NOT self-reported
    # A REQUIREMENT ON THE HOST, tier-dependent (docs/01 §5; docs/09 §5). This block declares
    # that an out-of-org backstop must exist; it does not implement one in this repo (docs/01
    # R0/C4). For a Tier-A org, the checker-independence and no-self-admission this guards are
    # enforced structurally + by the approval queue. For a Tier-B (asset-touching) org, the
    # HOST ENVIRONMENT provides the external
    # monitor / tamper-evidence / custody these keys ask for. The constitution states the
    # requirement; the chosen host satisfies it (docs/01 R2, C4).
    outside_org_write_authority: true   # external monitor over the append-only store
    dead_mans_switch: true              # missing invariants-hold heartbeat is itself a page
    heartbeat_interval_minutes: 30

# ── Invariants — no tier may touch these; violations are global-halt events ──
# HOW ENFORCED, by tier (docs/01 §5; docs/09 §5): these are REQUIREMENTS ON THE HOST, not a
# runtime this repo builds. For a Tier-A org, maker_never_own_checker and the append-only
# discipline are enforced STRUCTURALLY (which files the projection writes into which working
# dir — no self-admission is possible) + BY THE APPROVAL QUEUE + the lint. For a Tier-B
# (asset-touching) org, the HOST ENVIRONMENT supplies the sandboxing, tamper-evidence, and
# custody that make these invariants unfakeable at runtime. The constitution declares the
# invariant; the chosen host satisfies it at its tier (docs/01 R2, C4).
invariants:
  - ledger_append_only: true
  - no_knowledge_outside_ledger: true          # the anti-person-dependence (属人化) invariant
                                               # (docs/05 §5 — enforced by discipline + audit)
  - control_never_dormant_while_exploring: true
  - maker_never_own_checker: true
  - no_agent_writes_this_file: true            # a REQUIREMENT ON THE HOST: satisfied via repo
                                               # protection + CI/host identity checks the chosen
                                               # environment provides. The lint verifies the
                                               # DECLARATION; the host must verify authorship —
                                               # Tier-B orgs lean on the host's tamper-evidence
                                               # (docs/06 §2.4; docs/01 R2, C4).
