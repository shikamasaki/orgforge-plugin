# schedule.yaml — the DECLARATIVE operating schedule (docs/11 §5, docs/09 R0).
#
# This is the org's answer to "what operating-event check runs when, and what runs unattended
# overnight." It is DATA, not a runtime: an allowed skeleton artifact (docs/09 §2 whitelist
# item 2), lint-checked (item 3). The system ships NO scheduler — a host cron/CI/harness loop
# invokes tools/tick.py on a base interval, and tick.py computes which checks are DUE this tick.
# The registrar (an LLM agent, organization.yaml) OWNS this file: it edits the cadences to set
# the org's own schedule; the lint + tick.py are the guardrail that keeps its edits R0-safe and
# night-safe, and — critically — that a due check which did NOT run is DETECTED, never silently
# skipped ("起動するはずだった" must become an escalated fact, not an excuse — docs/11 §5.2).
#
# Cadence vocabulary is the EXISTING one (organization.yaml loop.cadence, sensors.yaml):
#   every_<n>_min | every_<n>_hours   — clock-triggered (level)
#   on_<event>                        — event-triggered (edge): on_candidate_arrival,
#                                       on_positive_result, on_handover_preparation, on_move(<id>)
# night_safe: true means this check MAY run while humans are away (constitution delegated.night).
#   Anything night_safe:false SUSPENDS overnight — fail-safe, not fail-open. For sensor->move
#   checks, night-safety is ALSO gated by the sensor's preregistered_for_night list (sensors.yaml);
#   this flag is necessary, not sufficient — the tighter of the two wins.
# tool: the tool the host invokes when the check is due (the pure check; it ledgers its verdict).
# verify_event: the ledger event CLASS whose presence proves this check actually ran in its
#   window. tick.py's missed-tick guard reports a due check with NO such event as a MISS.

base_interval: every_5_min      # the host cron's tick; must be <= the smallest cadence below

checks:

  # ── safety guardrails (docs/11 §2) — running code, tools/guardrails.py ───────────────
  - id: exposure_cap
    tool: "guardrails.py cap"
    cadence: on_asset_act          # edge: fires at every act touching a real asset
    night_safe: true               # the CAP is what MAKES night-running safe — always on
    verify_event: exposure_budget_checked
    escalates_to: approval_queue

  - id: state_reconcile
    tool: "guardrails.py reconcile"
    cadence: every_1_hours         # + an extra pre-dawn run (see night_extra)
    night_safe: true               # reconciliation must run MORE at night, not less
    night_extra: pre_dawn
    verify_event: state_reconciled
    escalates_to: halt_on_large_drift

  - id: stale_reference
    tool: "guardrails.py staleref"
    cadence: on_reference_change   # edge: doctrine admitted / charter edit / scope change / dept move
    night_safe: true
    verify_event: reference_staleness_checked
    escalates_to: nudge_then_ceo

  # ── knowledge organ (docs/07) — running code, tools/doctrine.py ─────────────────────
  - id: doctrine_stale_sweep
    tool: "doctrine.py stale"
    cadence: every_12_hours        # matches the curator's loop (organization.yaml)
    night_safe: true               # update_doctrine is preregistered_for_night (sensors.yaml)
    verify_event: doctrine_diff_admitted
    escalates_to: fire_curator

  # ── sensor battery (docs/11 D1) — running code, tools/sensors.py ────────────────────
  - id: machine_sensors
    tool: "sensors.py eval"
    cadence: every_30_min          # = sensors.yaml defaults.evaluation_cadence (registrar clock)
    night_safe: true               # readings are always safe; MOVES they fire honor preregistered_for_night
    verify_event: sensor_reading
    escalates_to: registrar_selects_move

  # ── ledger integrity (docs/11 D3/D4) — running code, tools/ledger.py ────────────────
  - id: chain_verify
    tool: "ledger.py verify"
    cadence: every_30_min
    night_safe: true               # a broken chain at night is the WORST time to be blind to
    verify_event: heartbeat        # a clean verify emits the watchdog heartbeat
    escalates_to: global_halt_on_break

  - id: digest
    tool: "ledger.py digest"
    cadence: every_24_hours        # the morning digest to the human (deterministic)
    night_safe: true               # generated overnight, read in the morning
    verify_event: digest_generated
    escalates_to: none             # the digest IS the escalation surface

  # ── lateral reconciliation (docs/11 §2.4) — design; tools/reconcile.py stub-runs ────
  - id: collision_scan
    tool: "reconcile.py collision"
    cadence: on_work_claimed       # edge: a peer claims territory
    night_safe: true               # duplicate resolves laterally; contradiction can wait for morning
    verify_event: lateral_reconciled
    escalates_to: lateral_then_ceo

  - id: dependency_stall
    tool: "reconcile.py stall"
    cadence: every_1_hours
    night_safe: true
    verify_event: dependency_stall_raised
    escalates_to: common_owner_move

  - id: contract_change
    tool: "reconcile.py contract"
    cadence: on_seam_edit          # edge: the gate sees a seam-shape change attempt
    night_safe: false              # breaking-change coordination waits for morning
    verify_event: contract_change_proposed
    escalates_to: skeptic_then_ceo

  # ── resource & learning (docs/11 §3) ───────────────────────────────────────────────
  - id: allocation_reclaim
    tool: "resource.py reclaim"
    cadence: every_6_hours
    night_safe: true               # reclaiming from an idle/low-yield holder is safe-direction
    verify_event: allocation_reclaimed
    escalates_to: ceo_on_protected

  - id: authority_review
    tool: "resource.py authority"
    cadence: every_12_hours
    night_safe: true               # auto-narrow is safe-direction; only widening escalates
    verify_event: authority_reviewed
    escalates_to: ceo_on_widen

  - id: priority_ranking
    tool: "resource.py rank"
    cadence: on_ranking_delta       # edge: a delta big enough to reorder lands
    night_safe: true
    verify_event: priority_ranking_set
    escalates_to: ceo_on_charter_downrank

  - id: outcome_delta
    tool: "learning.py delta"
    cadence: every_24_hours
    night_safe: true
    verify_event: outcome_delta
    escalates_to: ceo_on_systemic_recurrence

  # ── intra-department attention allocation (docs/12) — tools/attention.py ────────────
  - id: attention_select
    tool: "attention.py select"
    cadence: on_cycle_start         # edge: a department begins a cycle and must pick its next work
    night_safe: true               # picking within the org ranking + WIP limit is safe-direction
    verify_event: attention_allocated
    escalates_to: ceo_on_coverage_gap

# ── missed-tick policy (docs/11 §5.2) — the "it was SUPPOSED to run" guard ────────────
# A check whose cadence made it DUE in the window but whose verify_event is ABSENT from the
# ledger for that window is a MISS. A miss is not silent: tick.py reports it, and repeated
# misses of a night_safe check escalate — because a schedule the host quietly stopped firing
# is indistinguishable from an org that had nothing to do, and that ambiguity is the exact
# failure this whole layer exists to remove.
missed_tick:
  grace_intervals: 2               # allow this many base_intervals of lateness before MISS
  escalate_after_consecutive: 3    # consecutive misses of one check -> escalate (host may be down)
  on_escalate: wake_up_push        # constitution wake_up_push — a missing schedule is a page
