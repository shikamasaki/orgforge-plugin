name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the pinned Delegation Resilience foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shikamasaki/delegation-resilience
          ref: 67960e093217d6d2512b1d55d5d9afba658198f8
          path: .delegation-resilience
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run the complete test suite
        env:
          DR_V0ALPHA2_ROOT: ${{ github.workspace }}/.delegation-resilience
        run: python -m pytest tests --quiet

      - name: Verify Claude Code projection is synchronized
        run: bash integrations/claude-code/build.sh --check

      - name: Verify Codex projection is synchronized
        run: bash integrations/codex/build.sh --check

      - name: Verify publish metadata
        run: python tools/release_check.py

      - name: Reject whitespace errors
        run: git diff --check
