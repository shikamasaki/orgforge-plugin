name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The pinned DR graph verifier and v0alpha2 portable verifier declare CPython 3.12.8.
        # Do not float to a newer 3.12 patch release: that would invalidate the
        # verifier-environment assertion rather than independently verify it.
        python: ["3.12.8"]

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the pinned Delegation Resilience foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shikamasaki/delegation-resilience
          ref: bbd23510f6a5aae5e430a9d5626f8591f9db055d
          path: .delegation-resilience
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run the complete test suite
        env:
          DR_V0ALPHA2_ROOT: ${{ github.workspace }}/.delegation-resilience
        # The suite is subprocess-heavy (each organ runs as a real process), so it is bound by
        # process startup rather than CPU: 638s serial vs 91s on 8 workers, same 1078 passing.
        # `-n auto` sizes to the runner. Tests must stay independent for this to hold — one that
        # depends on another's leftover state will fail here rather than pass by accident.
        run: python -m pytest tests --quiet -n auto

      - name: Verify Claude Code projection is synchronized
        run: bash integrations/claude-code/build.sh --check

      - name: Verify Codex projection is synchronized
        run: bash integrations/codex/build.sh --check

      - name: Verify publish metadata
        run: python tools/release_check.py

      - name: Reject whitespace errors
        run: git diff --check
